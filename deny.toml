# cargo-deny policy. See https://embarkstudios.github.io/cargo-deny/

[licenses]
# Every dependency license in the tree is a standard permissive one.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

[advisories]
# Both are unmaintained (not security) advisories on transitive crates pulled in
# by model2vec-rs through tokenizers, with no upstream fix available.
ignore = [
    "RUSTSEC-2024-0436", # paste, unmaintained
    "RUSTSEC-2025-0119", # number_prefix, unmaintained
]
