[package]
name = "scry"
version = "0.0.0"
edition = "2021"
description = "Scry finds code by intent, returning the file and line range."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/s3rj1k/scry"
repository = "https://github.com/s3rj1k/scry"
documentation = "https://github.com/s3rj1k/scry#readme"
keywords = ["code-search", "ai-agent", "semantic-search", "embeddings", "tree-sitter"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
authors = ["s3rj1k <evasive.gyron@gmail.com>"]

[[bin]]
name = "scry"
path = "src/main.rs"

[lib]
name = "scry"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
ndarray = "0.17"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only", "fancy-regex"] }
text-splitter = { version = "0.32", features = ["code"] }
tree-sitter-tags = "0.26.11"
